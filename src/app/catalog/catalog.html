<div class="container">
  <div class="filters">
    <a class="button bold" (click)="filter='Heads'">Heads</a>
    <a class="button" (click)="filter='Arms'">Arms</a>
    <a class="button" (click)="filter='Torsos'">Torsos</a>
    <a class="button" (click)="filter='Bases'">Bases</a>
    <a class="button" (click)="filter=''">All</a>
  </div>

  <ul class="products">
    <li class="product-item" *ngFor="let product of getFilteredProducts()">
      <div class="product">
        <div class="product-details">
          <img [src]="getImageUrl(product)" [alt]="product?.name" />
          <div class="product-info">
            <div class="name">{{product?.name}}</div>
            <div class="description">{{product?.description}}</div>
            <div class="category">Part Type: {{product?.category}}</div>
          </div>
        </div>
        <div class="price">
          <!-- <div [style.color]="product?.discount > 0 ? 'red' [class.strickthrough]="product?.discount > 0">{{product?.price | currency}}</div> -->
          <div style="font-weight: bolder;"  [ngStyle]="{color: product?.discount > 0 ? 'red' : ''}" [ngClass]="{strickthrough: product?.discount > 0}">{{product?.price | currency}}</div>
          
          <div class="discount" *ngIf="product?.discount > 0">
              {{product?.price * (1 - product?.discount) | currency: 'USD':'symbol':'1.2-2'}}
          </div>
          <button class="cta">Buy</button>
        </div>
      </div>
    </li>
  </ul>
</div>
