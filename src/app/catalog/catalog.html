<div class="container">
  <div class="filters">
    <a routerLinkActive="active" class="button bold" routerLink="/catalog" [queryParams]="{category : 'Heads'}">Heads</a>
    <a routerLinkActive="active" class="button" routerLink="/catalog" [queryParams]="{category : 'Arms'}">Arms</a>
    <a routerLinkActive="active" class="button" routerLink="/catalog" [queryParams]="{category : 'Torsos'}">Torsos</a>
    <a routerLinkActive="active" class="button" routerLink="/catalog" [queryParams]="{category : 'Bases'}">Bases</a>
    <a routerLinkActive="active" class="button" routerLink="/catalog" [routerLinkActiveOptions]="{exact: true}">All</a>
  </div>

  <ul class="products">
    <li class="product-item" *ngFor="let product of getFilteredProducts()">
      <bot-product-details [product]="product" (buy)="AddToCart(product)"></bot-product-details>
    </li>
  </ul>
</div>
